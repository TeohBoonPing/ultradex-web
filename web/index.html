<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c15">
  <meta name="description" content="Browse Ultraman characters by era and watch their rise videos.">
  <title>Ultradex</title>
  <link rel="icon" type="image/x-icon" href="assets/logos/fav.ico">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c15;
      --panel: #0d1320;
      --panel-2: #121a29;
      --text: #f4f6fa;
      --muted: #939dab;
      --line: rgba(203, 218, 241, .12);
      --accent: #98d5eb;
      --max: 1300px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); min-width: 320px; }
    body.is-locked { overflow: hidden; }
    button,input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline: 2px solid #b6edff; outline-offset: 4px; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    [hidden] { display: none !important; }
    .wrap { width: min(var(--max), calc(100% - 104px)); margin: 0 auto; }

    /* Subtle light and stars — kept out of the way of the artwork. */
    .sky { position: absolute; inset: 0 0 auto; height: 880px; pointer-events: none; overflow: hidden; z-index: -1; }
    .sky::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(ellipse 58% 46% at 74% 39%, rgba(29,62,113,.28), transparent 83%),
      radial-gradient(ellipse 38% 30% at 15% 7%, rgba(23,53,100,.16), transparent 85%),
      linear-gradient(180deg, #0c1423 0%, #080c15 95%); }
    .sky::after { content: ""; position: absolute; inset: 0; opacity: .37; background-image:
      radial-gradient(1px 1px at 7% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 19% 41%,#fff 98%,transparent),
      radial-gradient(1px 1px at 34% 12%,#fff 98%,transparent),radial-gradient(1px 1px at 49% 62%,#fff 98%,transparent),
      radial-gradient(1px 1px at 63% 28%,#fff 98%,transparent),radial-gradient(1px 1px at 77% 8%,#fff 98%,transparent),
      radial-gradient(1px 1px at 87% 57%,#fff 98%,transparent),radial-gradient(1px 1px at 93% 24%,#fff 98%,transparent),
      radial-gradient(2px 2px at 28% 77%,#b5d5ff 85%,transparent),radial-gradient(2px 2px at 70% 72%,#b5d5ff 85%,transparent);
      background-size: 390px 330px; }

    /* Navigation */
    .header { height: 76px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(8,12,21,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 20; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 18px; font-weight: 740; letter-spacing: .14em; display: inline-flex; align-items: center; gap: 12px; }
    .brand-symbol { width: 24px; height: 24px; color: #a6deef; }
    .nav { display: flex; align-items: center; gap: 32px; color: #b0b9c8; font-size: 13px; }
    .nav a:hover { color: white; }
    .nav .nav-external { display: inline-flex; align-items: center; gap: 5px; }

    /* Featured character, first in the supplied data */
    /* Fixed visual stage: the character image must never stretch the hero taller. */
    .hero { height: clamp(550px, 73svh, 695px); display: grid; grid-template-columns: 45% 55%; align-items: stretch; position: relative; isolation: isolate; overflow: hidden; }
    .hero-copy { position: relative; z-index: 3; padding: 0 0 12px; align-self: center; max-width: 470px; }
    .overline { display: block; color: #89a0bc; font-size: 11px; text-transform: uppercase; letter-spacing: .23em; font-weight: 630; }
    .hero h1 { margin: 0 0 28px; font-size: clamp(50px, 5.4vw, 82px); line-height: .96; letter-spacing: -.065em; font-weight: 680; color: #f4f8fd; }
    .hero-feature { margin: 0 0 34px; }
    .hero-feature-label { display: block; color: #89a2bb; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 620; margin-bottom: 14px; }
    .hero-name { font-size: clamp(25px,2.65vw,36px); font-weight: 570; color: #f0f5fc; line-height: 1.15; min-height: 31px; margin: 0; letter-spacing: -.045em; }
    .hero-actions { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
    .primary { display: inline-flex; align-items: center; justify-content: center; gap: 11px; min-height: 48px; background: #e6f4fb; color: #0a1725; border: 1px solid #e6f4fb; border-radius: 9px; padding: 0 21px; font-size: 13px; font-weight: 650; transition: background .2s, transform .2s; }
    .primary:hover { background: #fff; transform: translateY(-2px); }
    .quiet-link { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #c3cfdc; padding: 8px 0; font-size: 13px; }
    .quiet-link:hover { color: #fff; }
    .hero-art { min-width: 0; height: 100%; position: relative; overflow: hidden; }
    .orbit { position: absolute; width: min(91%, 560px); aspect-ratio: 1; border: 1px solid rgba(165,203,248,.12); border-radius: 50%; left: 50%; top: 51%; transform: translate(-50%,-50%); }
    .orbit::before,.orbit::after { content:""; position:absolute; border:1px solid rgba(166,202,239,.075); border-radius:50%; }
    .orbit::before { inset: 15%; }
    .orbit::after { inset: -18%; }
    .hero-art::before { content: ""; position: absolute; inset: 7% -8% 0; background: radial-gradient(ellipse 52% 51% at 51% 56%, rgba(68,123,186,.29),rgba(30,60,116,.09) 53%,transparent 75%); pointer-events: none; }
    .hero-art::after { content: ""; position: absolute; inset: auto -10% 0; height: 22%; background: linear-gradient(transparent, rgba(7,11,20,.34)); pointer-events: none; z-index: 2; }
    .hero-art img { position: absolute; z-index: 2; left: 0; bottom: 0; width: 100%; height: 96%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 26px 30px rgba(0,0,0,.42)); }
    .hero-corner { position: absolute; z-index: 3; bottom: 28px; right: 0; color: #788aa1; font-size: 10px; letter-spacing: .16em; }

    /* The same night sky continues into the whole character collection. */
    .collection {
      position: relative;
      isolation: isolate;
      padding: 72px 0 105px;
      scroll-margin-top: 100px;
    }
    .collection::before {
      content: "";
      position: absolute;
      left: 50%; top: -130px; bottom: -70px;
      width: 100vw;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
      background-image:
        radial-gradient(ellipse 690px 550px at 91% 9%, rgba(31,74,127,.21), transparent 83%),
        radial-gradient(ellipse 720px 670px at 4% 37%, rgba(36,67,117,.17), transparent 83%),
        radial-gradient(ellipse 700px 710px at 94% 77%, rgba(30,70,105,.16), transparent 86%),
        radial-gradient(circle 1px at 11% 14%, rgba(205,226,255,.65) 97%, transparent),
        radial-gradient(circle 1px at 68% 64%, rgba(205,226,255,.55) 97%, transparent),
        radial-gradient(circle 1.3px at 82% 28%, rgba(147,198,241,.6) 97%, transparent),
        radial-gradient(circle 1px at 33% 81%, rgba(205,226,255,.4) 97%, transparent);
      background-size: auto, auto, auto, 421px 389px, 567px 421px, 683px 523px, 353px 471px;
      background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat, repeat, repeat;
    }
    .collection::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      width: min(63vw, 730px);
      aspect-ratio: 1;
      right: 0;
      top: 50px;
      border: 1px solid rgba(142,192,238,.065);
      border-radius: 50%;
      box-shadow: inset 0 0 140px rgba(53,100,160,.035), 0 0 120px rgba(26,63,120,.03);
    }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .section-head h2 { font-size: clamp(30px,3vw,43px); letter-spacing: -.045em; line-height: 1.1; font-weight: 620; margin: 8px 0 0; }
    .count { color: #8291a5; font-size: 13px; margin: 0 0 4px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 23px; }
    .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { border: 1px solid transparent; background: transparent; color: #97a4b6; padding: 10px 16px; border-radius: 9px; font-size: 13px; white-space: nowrap; transition: background .2s, color .2s; }
    .filter:hover { color: white; }
    .filter[aria-pressed="true"] { border-color: rgba(165,208,248,.2); background: rgba(35,61,91,.7); color: #f4faff; box-shadow: inset 0 1px 0 rgba(203,231,255,.05); }
    .search { display: flex; align-items: center; height: 44px; width: 280px; min-width: 190px; border: 1px solid rgba(177,209,245,.15); border-radius: 9px; background: rgba(18,32,51,.68); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 0 14px; gap: 10px; color: #9eb8cd; }
    .search:focus-within { border-color: rgba(159,207,240,.55); }
    .search svg { width: 17px; height: 17px; flex-shrink: 0; }
    .search input { min-width: 0; width: 100%; outline: 0; background: transparent; color: #fff; border: 0; font-size: 13px; }
    .search input::placeholder { color: #8290a3; }
    .search button { padding: 3px; border: 0; background: transparent; color: #a2afbf; font-size: 21px; line-height: 1; }
    .grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; }
    .character { text-align: left; min-width: 0; padding: 0; color: inherit; background: #101c2e; border: 1px solid rgba(171,207,250,.11); border-radius: 13px; overflow: hidden; position: relative; isolation: isolate; aspect-ratio: .75; transition: transform .28s, border-color .28s, box-shadow .28s; }
    .character:hover { transform: translateY(-5px); border-color: rgba(158,207,252,.34); box-shadow: 0 16px 45px rgba(0,0,0,.26), 0 0 32px rgba(62,124,192,.095); }
    .character::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 50% 42%, transparent 0 31%, rgba(167,204,248,.10) 31.2%, transparent 31.55%, transparent 45.8%, rgba(167,204,248,.055) 46%, transparent 46.35%),
        radial-gradient(circle 1px at 17% 23%, rgba(205,229,255,.64) 95%, transparent),
        radial-gradient(circle 1px at 83% 19%, rgba(205,229,255,.48) 95%, transparent),
        radial-gradient(circle 1px at 75% 61%, rgba(205,229,255,.30) 95%, transparent),
        radial-gradient(ellipse 72% 55% at 51% 43%, var(--card-glow,rgba(83,132,185,.2)), transparent 90%),
        linear-gradient(158deg,#182941,#101a2a 76%,#0b1220);
    }
    .character::after { content: ""; position: absolute; inset: auto 0 0; height: 37%; background: linear-gradient(transparent,#0b111e 90%); pointer-events: none; }
    .character img { position: absolute; inset: 9% 4% 12%; width: 92%; height: 79%; object-fit: contain; object-position: bottom center; filter: drop-shadow(0 14px 18px rgba(0,0,0,.36)); transition: transform .35s; }
    .character:hover img { transform: scale(1.045) translateY(-5px); }
    .character-tag { position: absolute; top: 18px; left: 17px; color: #c3cfde; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; z-index: 2; }
    .character-bottom { position: absolute; bottom: 21px; left: 19px; right: 19px; z-index: 2; display: flex; justify-content: space-between; align-items: end; gap: 5px; }
    .character-name { font-size: clamp(17px,1.5vw,23px); font-weight: 610; letter-spacing: -.035em; line-height: 1.14; }
    .character-bottom svg { width: 17px; height: 17px; flex-shrink: 0; color: #a8c1d6; }
    .image-fallback { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: #8296b0; font-size: 12px; letter-spacing: .12em; pointer-events: none; z-index: 0; }
    .empty { padding: 90px 12px; grid-column: 1/-1; text-align: center; color: #9caabd; }
    .empty h3 { font-size: 20px; color: #f0f4fa; font-weight: 540; margin: 0 0 8px; }
    .empty p { margin: 0 0 15px; font-size: 13px; }
    .empty button { background: none; border: 0; color: #a7d6f5; }

    .footer { position: relative; border-top: 1px solid rgba(170,207,243,.09); background: linear-gradient(180deg,rgba(13,25,42,.25),#070b13); padding: 29px 0; font-size: 12px; color: #718095; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .footer a { color: #a8b9cc; }

    /* Rise video always starts from a character click, BEFORE the profile. */
    /* Full-bleed, centered playback with a short crossfade into the profile. */
    .video-screen { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #000; opacity: 0; transition: opacity .42s ease; }
    .video-screen.is-visible { opacity: 1; }
    .video-screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; background: #000; }
    .video-screen.is-visible video { animation: videoPushIn 14s linear both; }
    @keyframes videoPushIn { from { transform: scale(1.018); } to { transform: scale(1.06); } }
    .video-screen::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg,rgba(0,0,0,.42),transparent 23%,transparent 73%,rgba(0,0,0,.48)); }
    .video-ui { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 30px max(28px, env(safe-area-inset-right)); }
    .video-top,.video-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .video-label { color: #e8edf5; font-size: 13px; font-weight: 580; text-shadow: 0 1px 9px rgba(0,0,0,.65); }
    .video-ui button,.video-center button { pointer-events: auto; background: rgba(24,30,41,.72); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.22); color: white; border-radius: 8px; padding: 11px 17px; font-size: 13px; }
    .video-screen::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,.18) 100%); }
    .video-ui button:hover,.video-center button:hover { background: rgba(62,73,89,.8); }
    .video-center { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 25px; text-align: center; pointer-events: none; }
    .video-center button { pointer-events: auto; }
    .video-center p { color: #dde5ec; font-size: 13px; margin: 0; line-height: 1.6; }
    .video-loader { width: 25px; height: 25px; border: 2px solid rgba(255,255,255,.2); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Character profile */
    .profile-screen { position: fixed; inset: 0; background: rgba(2,5,10,.82); z-index: 80; display: grid; place-items: center; padding: 24px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .profile-screen:not([hidden]) .profile { animation: profileAppear .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes profileAppear { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .profile { width: min(1060px,100%); height: min(780px,calc(100dvh - 48px)); max-height: calc(100dvh - 48px); background: #0c1421; border: 1px solid rgba(191,215,243,.18); border-radius: 16px; display: grid; grid-template-columns: 44% minmax(0,56%); grid-template-rows: minmax(0,1fr); overflow: hidden; position: relative; box-shadow: 0 35px 90px rgba(0,0,0,.5); }
    .profile-art { position: relative; height: 100%; min-height: 0; background: radial-gradient(ellipse 67% 53% at 50% 43%,rgba(64,113,168,.23),transparent 80%), #111d2e; overflow: hidden; display: grid; place-items: center; }
    .profile-art::before { content: ""; width: 75%; aspect-ratio: 1; border: 1px solid rgba(185,217,249,.13); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .profile-art img { width: 100%; height: 100%; object-fit: contain; object-position: center center; position: absolute; inset: 0; padding: 28px 20px; filter: drop-shadow(0 14px 25px rgba(0,0,0,.35)); }
    .profile-content { min-height: 0; padding: 54px 53px 45px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
    .profile-close { position: absolute; z-index: 5; top: 16px; right: 16px; width: 37px; height: 37px; background: rgba(45,56,73,.9); color: #e8eef5; border: 1px solid rgba(255,255,255,.1); border-radius: 50%; font-size: 23px; line-height: 1; }
    .profile h2 { font-size: clamp(38px,4vw,56px); line-height: 1.04; font-weight: 630; letter-spacing: -.055em; margin: 12px 32px 19px 0; }
    .profile-description { margin: 0 0 28px; font-size: 14px; line-height: 1.7; color: #abb9ca; }
    .profile-rule { height: 1px; background: var(--line); border: 0; margin: 0 0 24px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; margin-bottom: 30px; }
    .fact-label { color: #8190a4; font-size: 11px; margin-bottom: 7px; }
    .fact-value { color: #e8edf5; font-size: 16px; font-weight: 530; overflow-wrap: anywhere; }
    .detail-heading { margin: 0 0 17px; font-size: 12px; color: #bdc9d7; letter-spacing: .02em; font-weight: 560; }
    .stat { margin: 0 0 15px; }
    .stat-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #a8b7c9; }
    .stat-track { width: 100%; height: 4px; border-radius: 3px; background: #263246; overflow: hidden; }
    .stat-fill { height: 100%; background: #9bd9f0; border-radius: 3px; }
    .finisher { padding-top: 8px; padding-bottom: 27px; margin-top: 12px; }
    .finisher-value { margin: 5px 0 0; font-size: 17px; font-weight: 530; }
    .replay { border: 1px solid rgba(184,222,245,.28); color: #eff8fc; padding: 12px 17px; border-radius: 8px; background: #17263a; font-size: 13px; }
    .replay:hover { background: #223650; }

    @media(max-width:1100px) {
      .wrap { width: min(var(--max),calc(100% - 64px)); }
      .grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .hero { height: 570px; }
      .hero-copy { padding: 0 0 12px; }
      .hero-art { height: 100%; }
      .hero-art img { height: 94%; }
      .profile-content { padding: 45px 38px 40px; }
    }
    @media(max-width:730px) {
      .wrap { width: calc(100% - 36px); }
      .header { height: 62px; }
      .brand { font-size: 15px; gap: 9px; }
      .nav { gap: 16px; font-size: 12px; }
      .hero { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .hero-copy { padding: 52px 0 0; }
      .hero h1 { font-size: clamp(62px, 13vw, 86px); margin: 17px 0 28px; }
      .hero-feature { margin-bottom: 24px; }
      .hero-name { font-size: clamp(24px, 5.2vw, 30px); }
      .hero-art { min-height: 0; height: 365px; }
      .hero-art img { height: 100%; }
      .orbit { width: 320px; max-width: 84%; }
      .hero-corner { bottom: 10px; }
      .collection { padding: 49px 0 70px; }
      .collection::after { width: 85vw; right: 0; top: 70px; opacity: .6; }
      .section-head { margin-bottom: 23px; }
      .section-head h2 { font-size: 32px; }
      .controls { flex-direction: column-reverse; align-items: stretch; gap: 15px; }
      .search { width: 100%; }
      .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
      .character { aspect-ratio: .73; }
      .character-name { font-size: clamp(16px,4vw,21px); }
      .character-bottom { left: 13px; right: 12px; bottom: 16px; }
      .character-tag { left: 13px; top: 14px; font-size: 9px; }
      .profile-screen { padding: 0; }
      .profile { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; display: block; overflow-y: auto; }
      .profile-art { min-height: 345px; height: 345px; }
      .profile-art img { height: 345px; padding-top: 24px; }
      .profile-content { padding: 35px 24px 45px; overflow: visible; }
      .profile h2 { font-size: 42px; }
      .profile-close { position: fixed; right: 17px; top: 17px; }
      .video-ui { padding: 20px 16px; }
    }
    @media(max-width:390px) {
      .nav a:first-child { display: none; }
      .hero h1 { font-size: 59px; }
      .character-name { font-size: 15px; }
      .character-bottom svg { display: none; }
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#top" aria-label="Ultradex home">
        <svg class="brand-symbol" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="11.5" stroke="currentColor" stroke-opacity=".35"/><path d="M7 7v8a7 7 0 0 0 14 0V7M14 3v9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        ULTRADEX
      </a>
      <nav class="nav" aria-label="Navigation">
        <a href="#collection">Characters</a>
        <a class="nav-external" href="https://www.linkedin.com/in/boonpingteoh/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">LinkedIn <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap" aria-label="Featured Ultraman">
      <div class="hero-copy">
        <div class="hero-feature">
          <span class="hero-feature-label">Featured<span id="hero-era-inline"></span></span>
          <h1 id="hero-name">Ultraman</h1>
        </div>
        <div class="hero-actions">
          <button type="button" class="primary" id="hero-rise" hidden><span aria-hidden="true">▶</span> Play rise</button>
          <a class="quiet-link" href="#collection">Browse characters <span aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="hero-art" id="hero-art" hidden>
        <span class="orbit" aria-hidden="true"></span>
        <img id="hero-image" alt="" fetchpriority="high">
        <span class="hero-corner" id="hero-era"></span>
      </div>
    </section>

    <section class="collection wrap" id="collection" aria-labelledby="collection-heading">
      <div class="section-head">
        <div>
          <span class="overline">Browse</span>
          <h2 id="collection-heading">Characters</h2>
        </div>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
      <div class="controls">
        <div class="filters" id="filters" aria-label="Filter by era"></div>
        <div class="search" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5" stroke-linecap="round"/></svg>
          <input id="search-input" type="search" placeholder="Search Ultraman" autocomplete="off" aria-label="Search Ultraman">
          <button id="clear-search" type="button" aria-label="Clear search" hidden>×</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner"><span>ULTRADEX</span><a href="https://www.linkedin.com/in/boonpingteoh/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a></div>
  </footer>

  <!-- The rise video opens on EVERY character click, before the profile. -->
  <div class="video-screen" id="video-screen" role="dialog" aria-modal="true" aria-label="Ultraman rise video" hidden>
    <video id="rise-video" playsinline webkit-playsinline preload="auto"></video>
    <div class="video-center" id="video-loading" aria-live="polite"><div class="video-loader"></div><p>Loading rise…</p></div>
    <div class="video-center" id="video-error" hidden><p id="video-error-text">This rise video could not be played.</p><button type="button" id="video-view-profile">View profile →</button></div>
    <div class="video-center" id="video-manual" hidden><p>Tap to play the rise video.</p><button type="button" id="video-play">Play video ▶</button></div>
    <div class="video-ui">
      <div class="video-top"><span id="video-title" class="video-label"></span><button type="button" id="video-skip">Skip →</button></div>
      <div class="video-bottom"><button type="button" id="video-sound">Mute</button><span></span></div>
    </div>
  </div>

  <!-- Character profile appears after the rise ends or is skipped. -->
  <div class="profile-screen" id="profile-screen" role="dialog" aria-modal="true" aria-labelledby="profile-name" hidden>
    <div class="profile" id="profile">
      <button type="button" class="profile-close" id="profile-close" aria-label="Close profile">×</button>
      <div class="profile-art"><img id="profile-image" alt=""></div>
      <div class="profile-content">
        <span class="overline" id="profile-era"></span>
        <h2 id="profile-name"></h2>
        <p class="profile-description" id="profile-description"></p>
        <hr class="profile-rule">
        <div class="facts">
          <div><div class="fact-label">Height</div><div class="fact-value" id="profile-height"></div></div>
          <div><div class="fact-label">Weight</div><div class="fact-value" id="profile-weight"></div></div>
          <div><div class="fact-label">Age</div><div class="fact-value" id="profile-age"></div></div>
          <div><div class="fact-label">Home world</div><div class="fact-value" id="profile-origin"></div></div>
        </div>
        <h3 class="detail-heading">Stats</h3>
        <div id="profile-stats"></div>
        <div class="finisher"><div class="fact-label">Finisher</div><p class="finisher-value" id="profile-finisher"></p></div>
        <button class="replay" type="button" id="replay-rise">↻ Replay rise</button>
      </div>
    </div>
  </div>

  <script>
    // Original Go html/template fields. Existing backend and CDN URLs unchanged.
    const ULTRAS = [
      {{ range .ultramanList }}
      {
        id: "{{ .Slug }}",
        name: "{{ .Name }}",
        era: "{{ if .Era }}{{ .Era }}{{ else }}Unknown{{ end }}",
        height: "{{ if .Height }}{{ .Height }}{{ end }}",
        weight: "{{ if .Weight }}{{ .Weight }}{{ end }}",
        age: "{{ if .Age }}{{ .Age }}{{ end }}",
        origin: "{{ if .HomeWorld }}{{ .HomeWorld }}{{ else }}Unknown{{ end }}",
        description: "{{ if .Description }}{{ .Description }}{{ end }}",
        finisher: "{{ if .Finisher }}{{ .Finisher }}{{ else }}Unknown{{ end }}",
        stats: {
          str: {{ if .Strength }}{{ .Strength }}{{ else }}85{{ end }},
          agi: {{ if .Agility }}{{ .Agility }}{{ else }}85{{ end }},
          ene: {{ if .Energy }}{{ .Energy }}{{ else }}85{{ end }}
        },
        image: "https://cdn.ultradex.my/characters/{{ .Slug }}.png",
        video: "https://cdn.ultradex.my/rises/{{ .Slug }}.mp4"
      },
      {{ end }}
    ];

    const $ = id => document.getElementById(id);
    const state = { era: 'All', search: '', active: null, phase: 'idle', token: 0, focusBefore: null,
      unavailableRises: new Set(), riseTimeout: null, fadeTimeout: null };
    const eras = ['All','Showa','Heisei','Reiwa'];
    const tones = { Showa: 'rgba(143,181,209,.20)', Heisei: 'rgba(58,143,191,.20)', Reiwa: 'rgba(123,107,181,.22)' };
    const normalized = value => String(value ?? '').toLowerCase();

    function setImage(img, ultra) {
      img.style.opacity = '1';
      img.alt = ultra.name;
      img.onerror = () => { img.onerror = null; img.style.opacity = '0'; };
      img.src = ultra.image;
    }
    function formatUnit(value, unit) {
      const raw = String(value ?? '').trim();
      if (!raw) return 'Unknown';
      if (/[a-z]/i.test(raw)) return raw;
      const num = Number(raw.replace(/,/g,''));
      return (Number.isFinite(num) ? num.toLocaleString('en-US') : raw) + ' ' + unit;
    }
    function statNumber(value) { const n = Number(value); return Number.isFinite(n) ? Math.min(100,Math.max(0,n)) : 0; }

    function featured() {
      const ultra = ULTRAS[0];
      if (!ultra) return;
      $('hero-art').hidden = false;
      $('hero-rise').hidden = false;
      // A missing URL can be known immediately; a 404 will be detected during playback.
      $('hero-rise').innerHTML = ultra.video ? '<span aria-hidden="true">▶</span> Play rise' : 'View profile';
      $('hero-name').textContent = ultra.name;
      $('hero-era').textContent = (ultra.era || 'Unknown').toUpperCase() + ' ERA';
      $('hero-era-inline').textContent = (ultra.era ? ' · ' + ultra.era : '');
      setImage($('hero-image'),ultra);
      $('hero-rise').onclick = () => selectCharacter(ultra);
    }
    function renderFilters() {
      const wrapper = $('filters'); wrapper.replaceChildren();
      for (const era of eras) {
        const b = document.createElement('button'); b.type='button'; b.className='filter'; b.textContent=era === 'All' ? 'All' : era;
        b.setAttribute('aria-pressed',String(state.era===era));
        b.onclick=()=>{state.era=era;renderFilters();renderGrid();}; wrapper.append(b);
      }
    }
    function renderGrid() {
      const selected = ULTRAS.filter(u => (state.era==='All'|| normalized(u.era)===normalized(state.era)) && normalized(u.name).includes(normalized(state.search.trim())));
      $('count').textContent=`${selected.length} ${selected.length===1?'character':'characters'}`;
      const container = $('grid'); container.replaceChildren();
      if (!selected.length) {
        const empty=document.createElement('div'); empty.className='empty';
        const title=document.createElement('h3');title.textContent='No characters found';
        const hint=document.createElement('p');hint.textContent='Try another search or era.';
        const reset=document.createElement('button');reset.type='button';reset.textContent='Clear filters';reset.onclick=()=>{state.era='All';state.search='';$('search-input').value='';$('clear-search').hidden=true;renderFilters();renderGrid();};
        empty.append(title,hint,reset);container.append(empty);return;
      }
      const fragment=document.createDocumentFragment();
      selected.forEach(u=>{
        const card=document.createElement('button'); card.type='button';card.className='character';card.setAttribute('aria-label',`Watch ${u.name} rise`);
        card.style.setProperty('--card-glow',tones[u.era]||'rgba(83,132,185,.19)');
        const img=document.createElement('img'); img.loading='lazy'; img.decoding='async'; setImage(img,u);
        const tag=document.createElement('span');tag.className='character-tag';tag.textContent=u.era;
        const bottom=document.createElement('span');bottom.className='character-bottom';
        const name=document.createElement('span');name.className='character-name';name.textContent=u.name;
        const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 24 24');arrow.setAttribute('fill','none');arrow.setAttribute('stroke','currentColor');arrow.setAttribute('stroke-width','1.8');arrow.setAttribute('stroke-linecap','round');
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M5 12h14m-6-6 6 6-6 6');arrow.append(path);
        bottom.append(name,arrow);card.append(img,tag,bottom);
        card.addEventListener('click',()=>selectCharacter(u));fragment.append(card);
      });
      container.append(fragment);
    }

    function clearRiseTimeout() {
      if (state.riseTimeout !== null) clearTimeout(state.riseTimeout);
      state.riseTimeout = null;
    }
    function clearFadeTimeout() {
      if (state.fadeTimeout !== null) clearTimeout(state.fadeTimeout);
      state.fadeTimeout = null;
    }
    function riseUnavailable(ultra) {
      return !ultra.video || !String(ultra.video).trim() || state.unavailableRises.has(ultra.id);
    }
    function selectCharacter(ultra) {
      state.focusBefore = document.activeElement;
      state.active = ultra;
      document.body.classList.add('is-locked');
      if (riseUnavailable(ultra)) {
        state.phase = 'profile';
        showProfile(ultra); // No video: open details without showing a video/loading screen.
      } else {
        startRise(ultra);
      }
    }

    function startRise(ultra) {
      if (!ultra) return;
      if (riseUnavailable(ultra)) {
        state.phase = 'profile';
        showProfile(ultra);
        return;
      }
      clearRiseTimeout();
      clearFadeTimeout();
      const token = ++state.token;
      state.phase = 'video';
      $('profile-screen').hidden = true;
      const screen = $('video-screen');
      screen.hidden = false;
      screen.classList.remove('is-visible');
      $('video-title').textContent = ultra.name;
      $('video-loading').hidden = false;
      $('video-error').hidden = true;
      $('video-manual').hidden = true;
      document.body.classList.add('is-locked');

      const video = $('rise-video');
      video.pause();
      video.removeAttribute('src');
      video.muted = false;
      video.src = ultra.video;
      $('video-sound').textContent = 'Mute';
      requestAnimationFrame(() => {
        if (state.phase === 'video' && token === state.token) screen.classList.add('is-visible');
      });

      // Don't leave the visitor stuck on a spinner if a missing/unsupported rise never loads.
      state.riseTimeout = setTimeout(() => {
        if (state.phase === 'video' && token === state.token && video.paused) finishRise(true);
      }, 10000);

      // Calling play() directly from the character click helps browsers allow audio.
      const attempt = video.play();
      if (attempt && typeof attempt.catch === 'function') attempt.catch(err => {
        if (state.phase !== 'video' || token !== state.token) return;
        if (video.error || err?.name === 'NotSupportedError') { finishRise(true); return; }
        if (err?.name === 'AbortError') return;
        // For blocked autoplay, try silent playback or offer a one-tap play control.
        video.muted = true;
        $('video-sound').textContent = 'Unmute';
        const mutedAttempt = video.play();
        if (mutedAttempt && typeof mutedAttempt.catch === 'function') mutedAttempt.catch(mutedError => {
          if (state.phase !== 'video' || token !== state.token) return;
          if (video.error || mutedError?.name === 'NotSupportedError') { finishRise(true); return; }
          clearRiseTimeout();
          $('video-loading').hidden = true;
          $('video-manual').hidden = false;
        });
      });
    }

    function finishRise(unavailable = false) {
      if (state.phase !== 'video' || !state.active) return;
      const ultra = state.active;
      if (unavailable) state.unavailableRises.add(ultra.id);
      clearRiseTimeout();
      const token = ++state.token;
      state.phase = 'profile';
      const video = $('rise-video');
      video.pause();
      showProfile(ultra); // Display the profile behind the fading video.
      $('video-screen').classList.remove('is-visible');
      clearFadeTimeout();
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      state.fadeTimeout = setTimeout(() => {
        if (state.token !== token || state.phase === 'video') return;
        $('video-screen').hidden = true;
        video.removeAttribute('src');
        video.load();
        state.fadeTimeout = null;
      }, reducedMotion ? 0 : 440);
    }

    function showProfile(ultra) {
      $('profile-era').textContent=`${ultra.era} ERA`;
      $('profile-name').textContent=ultra.name;
      $('profile-description').textContent=ultra.description || '';
      $('profile-description').hidden=!ultra.description;
      $('profile-height').textContent=formatUnit(ultra.height,'m');
      $('profile-weight').textContent=formatUnit(ultra.weight,'t');
      $('profile-age').textContent=formatUnit(ultra.age,'years');
      $('profile-origin').textContent=ultra.origin || 'Unknown';
      $('profile-finisher').textContent=ultra.finisher || 'Unknown';
      $('replay-rise').hidden = riseUnavailable(ultra);
      setImage($('profile-image'),ultra);
      const stats=$('profile-stats');stats.replaceChildren();
      [['Strength',ultra.stats.str],['Agility',ultra.stats.agi],['Energy',ultra.stats.ene]].forEach(([label,value])=>{
        const amount=statNumber(value),row=document.createElement('div');row.className='stat';
        const head=document.createElement('div');head.className='stat-head';
        const title=document.createElement('span');title.textContent=label;
        const number=document.createElement('span');number.textContent=`${amount}%`;
        head.append(title,number);
        const track=document.createElement('div');track.className='stat-track';
        const fill=document.createElement('div');fill.className='stat-fill';fill.style.width=`${amount}%`;
        track.append(fill);row.append(head,track);stats.append(row);
      });
      $('profile').scrollTop=0;
      document.querySelector('.profile-content').scrollTop=0;
      $('profile-screen').hidden=false;
      $('profile-close').focus();
    }
    function closeProfile() {
      if(state.phase==='video') { finishRise(); return; }
      $('profile-screen').hidden=true;state.phase='idle';state.active=null;
      document.body.classList.remove('is-locked');
      if(state.focusBefore?.isConnected) state.focusBefore.focus();
    }

    function init() {
      featured(); renderFilters(); renderGrid();
      $('search-input').addEventListener('input',e=>{state.search=e.target.value;$('clear-search').hidden=!state.search;renderGrid();});
      $('clear-search').addEventListener('click',()=>{state.search='';$('search-input').value='';$('clear-search').hidden=true;renderGrid();$('search-input').focus();});
      $('video-skip').onclick=()=>finishRise();
      $('video-view-profile').onclick=()=>finishRise(true);
      $('video-play').onclick=()=>{ const v=$('rise-video');$('video-manual').hidden=true;$('video-loading').hidden=false; const p=v.play();if(p&&p.catch)p.catch(()=>{$('video-loading').hidden=true;$('video-manual').hidden=false;}); };
      $('video-sound').onclick=()=>{const v=$('rise-video');v.muted=!v.muted;$('video-sound').textContent=v.muted?'Unmute':'Mute';};
      const video=$('rise-video');
      video.addEventListener('playing',()=>{if(state.phase==='video'){clearRiseTimeout();$('video-loading').hidden=true;$('video-manual').hidden=true;}});
      video.addEventListener('waiting',()=>{if(state.phase==='video'){$('video-loading').hidden=false;}});
      video.addEventListener('ended',()=>finishRise());
      video.addEventListener('error',()=>{
        // Missing MP4 / 404 / unsupported codec: no error screen or replay action.
        if(state.phase==='video') finishRise(true);
      });
      $('profile-close').onclick=closeProfile;
      $('replay-rise').onclick=()=>{if(state.active && !riseUnavailable(state.active)) startRise(state.active);};
      $('profile-screen').addEventListener('click',e=>{if(e.target===$('profile-screen')) closeProfile();});
      document.addEventListener('keydown',e=>{
        if(e.key!=='Escape')return;
        if(state.phase==='video')finishRise();
        else if(state.phase==='profile')closeProfile();
      });
    }
    document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
