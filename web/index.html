<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultradex</title>
    <link rel="icon" type="image/x-icon" href="assets/logos/fav.ico">

    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space: {
                            900: '#030408',
                            800: '#0A0C14',
                            700: '#121626'
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        grotesk: ['"Space Grotesk"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            background-color: #030408;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Subtle Cosmic Background */
        .bg-cosmic {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 25, 45, 0.4) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(10, 15, 30, 0.6) 0%, transparent 50%);
        }

        /* Minimal Glass Panels */
        .glass-minimal {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-container {
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card-container:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Immersive Glow Effects */
        .nebula-glow {
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        
        .card-container:hover .nebula-glow {
            opacity: 0.8;
            transform: scale(1.2);
        }

        /* Smooth Image Scaling */
        .hero-img {
            transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.8));
        }
        
        .card-container:hover .hero-img {
            transform: scale(1.04) translateY(-8px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* Description Scrollbar */
        .desc-scroll::-webkit-scrollbar { width: 2px; }

        /* Entrance Animation */
        @keyframes subtleFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: subtleFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen relative pb-24 bg-cosmic text-slate-200">

    <!-- Starry Overlay (Ultra Minimal) -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-[0.15]" style="background-image: url('data:image/svg+xml,%3Csvg width=\\'60\\' height=\\'60\\' xmlns=\\'http://www.w3.org/2000/svg\\'%3E%3Ccircle cx=\\'30\\' cy=\\'30\\' r=\\'0.5\\' fill=\\'%23ffffff\\'%3E%3C/circle%3E%3C/svg%3E');"></div>

    <!-- MAIN APP -->
    <div id="main-app" class="relative z-10">
        
        <!-- Minimal Header -->
        <header class="sticky top-0 z-40 glass-minimal border-b-0">
            <div class="max-w-7xl mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
                
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center border border-white/20">
                        <div class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></div>
                    </div>
                    <h1 class="font-grotesk text-2xl font-medium tracking-[0.2em] text-white uppercase">
                        Ultradex
                    </h1>
                </div>

                <!-- Right Section: Search & Socials -->
                <div class="flex items-center space-x-5 w-full justify-end max-w-xl">
                    <!-- Search -->
                    <div class="flex items-center bg-space-900/50 rounded-full px-5 py-2.5 w-full max-w-xs sm:max-w-sm border border-white/10 focus-within:border-white/30 transition-all">
                        <svg class="w-4 h-4 text-slate-500 mr-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Search ultraman..." 
                            class="bg-transparent border-none outline-none text-white font-outfit font-light text-sm w-full placeholder-slate-600 focus:ring-0"
                        />
                    </div>

                    <!-- Social Links -->
                    <div class="hidden sm:flex items-center space-x-4 border-l border-white/10 pl-5">
                        <a href="https://www.linkedin.com/in/boonpingteoh/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="text-slate-500 hover:text-white transition-colors duration-300">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" /></svg>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-6 lg:px-12 mt-16">
            
            <!-- Minimal Filters -->
            <div class="flex flex-wrap items-center justify-center gap-4 mb-16" id="filter-container">
                <!-- Filter buttons injected via JS -->
            </div>

            <!-- Grid -->
            <div id="ultra-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10 xl:gap-14">
                <!-- Cards injected via JS -->
            </div>
        </main>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-6 bg-space-900/95 backdrop-blur-2xl hidden opacity-0 transition-opacity duration-500">
        <!-- Modal content injected via JS -->
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        const ULTRAS = [
            {{ range .ultramanList }}
            {
                id: "{{ .Slug }}",
                name: "{{ .Name }}",
                era: "{{ if .Era }}{{ .Era }}{{ else }}Unknown{{ end }}",
                height: "{{ if .Height }}{{ .Height }}{{ end }}",
                weight: "{{ if .Weight }}{{ .Weight }}{{ end }}",
                age: "{{ if .Age }}{{ .Age }}{{ end }}",
                origin: "{{ if .HomeWorld }}{{ .HomeWorld }}{{ else }}Unknown{{ end }}",
                description: "{{ if .Description }}{{ .Description }}{{ end }}",
                finisher: "{{ if .Finisher }}{{ .Finisher }}{{ else }}Signature Attack{{ end }}",
                color: "{{ if .Color }}{{ .Color }}{{ else }}from-blue-500 to-cyan-400{{ end }}",
                stats: {
                    str: {{ if .Strength }}{{ .Strength }}{{ else }}85{{ end }},
                    agi: {{ if .Agility }}{{ .Agility }}{{ else }}85{{ end }},
                    ene: {{ if .Energy }}{{ .Energy }}{{ else }}85{{ end }}
                },
                image: "https://cdn.ultradex.my/characters/{{ .Slug }}.png",
                video: "https://cdn.ultradex.my/rises/{{ .Slug }}.mp4"
            },
            {{ end }}
        ];

        const ERAS = ['All', 'Showa', 'Heisei', 'Reiwa'];

        // --- STATE ---
        let state = {
            search: '',
            selectedEra: 'All'
        };

        // --- DOM ELEMENTS ---
        const dom = {
            searchInput: document.getElementById('search-input'),
            filterContainer: document.getElementById('filter-container'),
            ultraGrid: document.getElementById('ultra-grid'),
            detailModal: document.getElementById('detail-modal')
        };

        // --- INIT ---
        function init() {
            renderFilters();
            renderGrid();
            setupEventListeners();
        }

        // --- RENDERERS ---
        function renderFilters() {
            dom.filterContainer.innerHTML = '';

            ERAS.forEach(era => {
                const btn = document.createElement('button');
                const isActive = state.selectedEra === era;
                
                btn.className = `px-5 py-1.5 rounded-full font-outfit font-light text-sm tracking-wide transition-all duration-300 ${
                    isActive 
                    ? 'bg-white text-space-900 shadow-[0_0_15px_rgba(255,255,255,0.2)]' 
                    : 'bg-transparent text-slate-400 border border-white/5 hover:border-white/20 hover:text-white'
                }`;
                btn.innerText = era;
                btn.onclick = () => {
                    state.selectedEra = era;
                    renderFilters(); 
                    renderGrid();
                };
                
                dom.filterContainer.appendChild(btn);
            });
        }

        function renderGrid() {
            const filteredUltras = ULTRAS.filter(ultra => {
                const matchesSearch = ultra.name.toLowerCase().includes(state.search.toLowerCase());
                const matchesEra = state.selectedEra === 'All' || ultra.era === state.selectedEra;
                return matchesSearch && matchesEra;
            });

            dom.ultraGrid.innerHTML = '';

            if (filteredUltras.length === 0) {
                dom.ultraGrid.innerHTML = `
                    <div class="col-span-full py-32 text-center flex flex-col items-center animate-fade opacity-0">
                        <h3 class="font-grotesk font-light text-2xl text-slate-400 tracking-widest">NO ENTITY FOUND</h3>
                    </div>
                `;
                return;
            }

            filteredUltras.forEach((ultra, index) => {
                const card = document.createElement('div');
                card.className = "card-container glass-minimal rounded-[2rem] overflow-hidden cursor-pointer group flex flex-col h-[500px] relative animate-fade opacity-0";
                // Cap delay to prevent extremely long entrance waits if list is huge
                card.style.animationDelay = `${Math.min(index * 50, 800)}ms`;
                card.onclick = () => openModal(ultra.id);
                
                const fallbackImg = `https://placehold.co/400x600/030408/ffffff?text=${encodeURIComponent(ultra.name)}`;

                card.innerHTML = `
                    <!-- Cosmic Image Area -->
                    <div class="relative h-[80%] w-full flex justify-center items-end pt-6 px-4 overflow-hidden">
                        
                        <!-- Core Nebula Glow -->
                        <div class="nebula-glow absolute top-[60%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-gradient-to-br ${ultra.color} blur-[80px] opacity-40 rounded-full z-0"></div>

                        <!-- Character Image -->
                        <img 
                            src="${ultra.image}" 
                            onerror="this.onerror=null;this.src='${fallbackImg}';" 
                            alt="${ultra.name}" 
                            loading="lazy"
                            class="hero-img h-full w-full object-contain object-bottom relative z-10" 
                        />
                        
                        <!-- Minimal Era Tag -->
                        <div class="absolute top-6 right-6 px-3 py-1 rounded-full bg-space-900/50 backdrop-blur-md border border-white/10 text-[9px] font-grotesk font-medium uppercase tracking-[0.2em] text-slate-300 z-20">
                            ${ultra.era}
                        </div>
                    </div>
                    
                    <!-- Clean Bottom Info -->
                    <div class="p-8 relative z-20 flex-grow flex flex-col justify-end bg-gradient-to-t from-space-900 via-space-900/80 to-transparent">
                        <div class="flex items-end justify-between">
                            <h2 class="font-grotesk font-medium text-2xl text-white tracking-wide group-hover:text-cyan-100 transition-colors duration-300">${ultra.name}</h2>
                            <svg class="w-5 h-5 text-white/30 group-hover:text-white transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                    </div>
                `;
                dom.ultraGrid.appendChild(card);
            });
        }

        // --- MODAL LOGIC ---
        function openModal(ultraId) {
            const ultra = ULTRAS.find(u => u.id === ultraId);
            if (!ultra) return;

            const fallbackImg = `https://placehold.co/400x600/030408/ffffff?text=${encodeURIComponent(ultra.name)}`;
            
            // Format Stats safely
            const heightDisplay = ultra.height ? `${ultra.height}m` : 'Unknown';
            const weightDisplay = ultra.weight ? `${parseInt(ultra.weight).toLocaleString()} t` : 'Unknown';
            const ageDisplay = ultra.age ? `${parseInt(ultra.age).toLocaleString()} yrs` : 'Unknown';
            const originDisplay = ultra.origin || 'Unknown';

            dom.detailModal.innerHTML = `
                <div id="video-overlay" class="fixed inset-0 z-[60] bg-space-900 flex items-center justify-center cursor-pointer transition-opacity duration-700 ease-in-out" onclick="revealDetails()">
                    <div id="skip-hint" class="absolute top-6 left-6 z-40 text-[10px] font-grotesk text-white/50 uppercase tracking-widest animate-pulse pointer-events-none">
                        Tap to skip rise
                    </div>

                    <div id="video-spinner" class="absolute z-30 flex flex-col items-center justify-center pointer-events-none transition-opacity duration-300">
                        <div class="w-12 h-12 border-2 border-white/10 border-t-cyan-400 rounded-full animate-spin"></div>
                        <div class="mt-4 text-[10px] font-grotesk text-cyan-400/80 uppercase tracking-[0.2em] animate-pulse">
                            Loading...
                        </div>
                    </div>

                    <video 
                        id="rise-video"
                        src="${ultra.video}" 
                        autoplay 
                        playsinline 
                        class="absolute inset-0 w-full h-full object-cover z-10"
                        onended="revealDetails()"
                        onerror="revealDetails()"
                        onwaiting="document.getElementById('video-spinner')?.classList.remove('opacity-0')"
                        onplaying="document.getElementById('video-spinner')?.classList.add('opacity-0')"
                        oncanplay="document.getElementById('video-spinner')?.classList.add('opacity-0')"
                    ></video>

                    <button id="mute-btn" onclick="toggleVideoMute(event)" class="absolute bottom-6 left-6 z-40 bg-space-900/60 backdrop-blur-xl p-3 rounded-full text-slate-300 hover:text-white border border-white/10 transition-all hover:bg-white/10 group">
                        <svg id="mute-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                        </svg>
                    </button>
                </div>

                <div class="w-full h-full sm:h-[85vh] sm:max-w-6xl glass-minimal sm:rounded-[2rem] flex flex-col md:flex-row shadow-2xl relative overflow-hidden" onclick="event.stopPropagation()">
                    
                    <button onclick="closeModal()" class="absolute top-6 right-6 z-50 bg-white/5 backdrop-blur-xl p-3 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-all border border-white/5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>

                    <div class="w-full md:w-1/2 relative h-[40%] md:h-full bg-space-900/50 flex items-end justify-center overflow-hidden border-b md:border-b-0 md:border-r border-white/5">
                        <div class="absolute top-[50%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-gradient-to-br ${ultra.color} blur-[120px] opacity-25 z-0"></div>
                        
                        <img 
                            src="${ultra.image}" 
                            onerror="this.onerror=null;this.src='${fallbackImg}';" 
                            alt="${ultra.name}" 
                            class="relative z-10 w-full h-full p-4 md:p-8 object-contain object-bottom drop-shadow-[0_30px_40px_rgba(0,0,0,0.9)]" 
                        />
                    </div>

                    <div id="modal-details-panel" class="w-full md:w-1/2 p-6 sm:p-10 md:p-14 relative z-20 flex flex-col bg-space-900/80 overflow-y-auto opacity-0 translate-y-4 transition-all duration-1000 ease-out">
                        
                        <div class="mb-8">
                            <span class="inline-block px-3 py-1 rounded-full border border-white/10 text-[10px] font-grotesk font-medium uppercase tracking-[0.2em] text-slate-400 mb-4">
                                ${ultra.era} Era
                            </span>
                            <h1 class="font-grotesk font-medium text-4xl sm:text-5xl lg:text-5xl text-white tracking-tight leading-tight">${ultra.name}</h1>
                        </div>

                        <div class="mb-8 border-l-2 border-white/20 pl-4">
                            <p class="text-sm text-slate-300 font-outfit leading-relaxed overflow-y-auto max-h-32 pr-2 desc-scroll">
                                ${ultra.description || "Data restricted. No further information available."}
                            </p>
                        </div>

                        <div class="grid grid-cols-2 gap-6 mb-10">
                            ${createMinimalDataBox("Height", heightDisplay)}
                            ${createMinimalDataBox("Weight", weightDisplay)}
                            ${createMinimalDataBox("Age", ageDisplay)}
                            ${createMinimalDataBox("Origin", originDisplay)}
                        </div>

                        <div class="mb-10">
                            <h3 class="font-outfit text-sm font-light text-slate-500 tracking-[0.1em] mb-4">COMBAT PARAMETERS</h3>
                            <div class="space-y-5">
                                ${createMinimalProgressBar("Strength", ultra.stats.str, "from-white/80 to-white")}
                                ${createMinimalProgressBar("Agility", ultra.stats.agi, "from-white/60 to-white/90")}
                                ${createMinimalProgressBar("Energy", ultra.stats.ene, "from-white/40 to-white/80")}
                            </div>
                        </div>

                        <div class="mt-auto pt-6 border-t border-white/5">
                            <h4 class="font-outfit text-xs font-light text-slate-500 tracking-[0.1em] mb-2">SIGNATURE FINISHER</h4>
                            <p class="text-xl font-grotesk font-light text-white tracking-wide">${ultra.finisher}</p>
                        </div>

                    </div>
                </div>
            `;

            dom.detailModal.classList.remove('hidden');
            dom.detailModal.classList.add('flex');
            void dom.detailModal.offsetWidth; // trigger reflow
            dom.detailModal.classList.remove('opacity-0');
        }

        function closeModal() {
            const video = document.getElementById('rise-video');
            if(video) video.pause(); // Stop audio immediately on close
            
            dom.detailModal.classList.add('opacity-0');
            setTimeout(() => {
                dom.detailModal.classList.add('hidden');
                dom.detailModal.classList.remove('flex');
                dom.detailModal.innerHTML = '';
            }, 500);
        }

        // --- HELPERS ---
        window.revealDetails = function() {
            const videoOverlay = document.getElementById('video-overlay');
            const detailsPanel = document.getElementById('modal-details-panel');
            
            if (videoOverlay) {
                // Fade out the video overlay and make it unclickable
                videoOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                // Pause the video after it has completely faded out to save resources
                setTimeout(() => {
                    const video = document.getElementById('rise-video');
                    if (video) video.pause();
                }, 700); 
            }

            if (detailsPanel && detailsPanel.classList.contains('opacity-0')) {
                // Fade in and slide up the details panel
                detailsPanel.classList.remove('opacity-0', 'translate-y-4');
                detailsPanel.classList.add('opacity-100', 'translate-y-0');
                
                // Animate progress bars slightly after the details panel begins appearing
                setTimeout(() => {
                    const bars = detailsPanel.querySelectorAll('.progress-fill');
                    bars.forEach(bar => {
                        const width = bar.getAttribute('data-width');
                        bar.style.width = width;
                    });
                }, 300);
            }
        };

        window.toggleVideoMute = function(e) {
            e.stopPropagation();
            const video = document.getElementById('rise-video');
            const icon = document.getElementById('mute-icon');
            if (video) {
                video.muted = !video.muted;
                if (video.muted) {
                    icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
                } else {
                    icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>`;
                }
            }
        };

        function createMinimalDataBox(label, value) {
            return `
                <div>
                    <span class="block text-[10px] text-slate-500 font-outfit font-light uppercase tracking-[0.15em] mb-2">${label}</span>
                    <span class="block text-xl text-slate-100 font-grotesk font-light">${value}</span>
                </div>
            `;
        }

        function createMinimalProgressBar(label, value, gradientClass) {
            return `
                <div>
                    <div class="flex justify-between text-xs font-outfit font-light tracking-wider mb-2">
                        <span class="text-slate-400">${label}</span>
                        <span class="text-slate-200">${value}%</span>
                    </div>
                    <div class="h-[2px] w-full bg-white/5 overflow-hidden">
                        <div class="h-full bg-gradient-to-r ${gradientClass} progress-fill" 
                             style="width: 0%; transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)"
                             data-width="${value}%"></div>
                    </div>
                </div>
            `;
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            dom.searchInput.addEventListener('input', (e) => {
                state.search = e.target.value;
                renderGrid();
            });

            dom.detailModal.addEventListener('click', closeModal);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !dom.detailModal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        }

        // Run
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
